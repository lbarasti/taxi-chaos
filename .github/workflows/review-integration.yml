name: Validate reviewed integration

on:
  push:
    branches: [fix/wasted-hospital-respawn]
    paths: [.github/workflows/review-integration.yml]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Integrate the reviewed woodland commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git rev-parse origin/main)" = 54a9d1b7e8bec61d4b606902136d969148df3407
          if ! git merge --no-commit --no-ff 54a9d1b7e8bec61d4b606902136d969148df3407; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != 'src/world.ts' ]; then
              git diff --cc
              echo 'Unexpected integration conflict; refusing to publish.'
              exit 1
            fi
            # This branch already contains both the complete woodland world and hospital landmark.
            git checkout --ours src/world.ts
            git add src/world.ts
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Install dependencies
        run: npm ci
      - name: Demonstrate the dispatch regression before fixing it
        shell: bash
        run: |
          if npm test -- --run src/hospital-dispatch.test.ts; then
            echo 'Expected the newly added dispatch regression to fail before the fix.'
            exit 1
          fi
      - name: Fix dispatch to follow the current actor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/game.ts')
          source = path.read_text()
          start = source.index('  newJob(first = false) {')
          end = source.index('\n  setJobType()', start)
          block = source[start:end]
          assert block.count('this.player.body.position') == 5, 'Unexpected dispatch implementation'
          block = block.replace('this.player.body.position', 'this.actor.position')
          block = block.replace('    if (dist(pickup, this.actor.position)', '    // Dispatch follows the driver after hospital respawn, not the abandoned wreck.\n    if (dist(pickup, this.actor.position)', 1)
          path.write_text(source[:start] + block + source[end:])
          PY
          # The one-shot integration workflow must never be merged onto main.
          git rm .github/workflows/review-integration.yml
          git add src/game.ts src/world.ts
          git diff --cached --check
      - name: Test the integrated source
        run: npm test
      - name: Typecheck and build the integrated source
        run: npm run build
      - name: Publish only the tested merge to the existing PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          remote_head="$(git ls-remote origin refs/heads/fix/wasted-hospital-respawn | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git commit -m 'Merge main and fix hospital-area dispatch after distant explosions'
          git log -1 --format='Tested commit: %H'
          git rev-parse 'HEAD^{tree}'
          git push origin HEAD:refs/heads/fix/wasted-hospital-respawn
